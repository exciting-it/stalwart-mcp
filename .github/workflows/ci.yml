name: CI

# Quality gate only. Deploys go through Cloudflare Workers Builds (Git integration), never
# from Actions.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run depgraph
      - run: bun run check:brand
      - run: bunx wrangler deploy --dry-run --env=""
      - run: bunx wrangler deploy --dry-run --env staging
